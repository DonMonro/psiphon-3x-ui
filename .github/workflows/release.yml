name: Release

on:
  push:
    tags:
      - "*.*.*"
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    # GitHub supplies source archives for the tag; publish no built artifacts.
    runs-on: ubuntu-22.04
    steps:
      - name: Create GitHub release with assets
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Psiphon-3X-UI ${{ github.ref_name }}

            The update confirmation now opens as a compact pop-up above the Update button while
            retaining the existing version, revision, progress, and confirmation actions. Dashboard
            CPU and RAM percentages now appear above the application version.

            This release includes only GitHub-generated source code archives. No wheel, checksum
            bundle, or other release assets are attached.

            Install on an Ubuntu server with Sanaei 3x-ui already installed:

            ```bash
            bash <(curl -sL https://raw.githubusercontent.com/DonMonro/psiphon-3x-ui/${{ github.ref_name }}/install.sh) \
              || bash <(wget -qO- https://raw.githubusercontent.com/DonMonro/psiphon-3x-ui/${{ github.ref_name }}/install.sh)
            ```

          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
