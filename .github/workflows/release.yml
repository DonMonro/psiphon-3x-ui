name: Release

on:
  push:
    tags:
      - "*.*.*"
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    # GitHub supplies source archives for the tag; publish no built artifacts.
    runs-on: ubuntu-22.04
    steps:
      - name: Publish source release
        uses: softprops/action-gh-release@v2
        with:
          name: Psiphon-3X-UI ${{ github.ref_name }}
          body: |
            ## Psiphon-3X-UI ${{ github.ref_name }}

            This patch fixes re-applying existing country tunnels when a saved config file is not writable by the panel service.
            Configs are written to a temporary file and atomically replaced, so legacy root-owned files no longer block
            tunnel restarts. The replacement file retains service-readable permissions, and tunnel-core cannot observe a
            partially written JSON config. This also resolves the connection-refused symptom caused by the failed restart.

            The dashboard, sign-in page, setup wizard, Python package, and application metadata now consistently report v1.2.1.

            For installations still running an older version, repair an affected config file with `chown` and `chmod` as
            described in the [tunnel troubleshooting guide](https://github.com/DonMonro/psiphon-3x-ui/blob/${{ github.ref_name }}/docs/TROUBLESHOOTING.md#per-country-psiphon-tunnels-psiphon-tunnelcode-service),
            then retry **Re-apply everything**.

            This release provides only GitHub-generated source ZIP and tar.gz archives for the tag; no binaries, wheels,
            checksums, or other release assets are attached.

          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
