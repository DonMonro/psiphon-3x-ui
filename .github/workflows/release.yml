name: Release

on:
  push:
    tags:
      - "*.*.*"
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    # GitHub supplies source archives for the tag; publish no built artifacts.
    runs-on: ubuntu-22.04
    steps:
      - name: Create GitHub release with assets
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Psiphon-3X-UI ${{ github.ref_name }}

            This release adds live CPU, memory, root disk, and swap usage cards to the dashboard,
            plus compact CPU and RAM indicators beside the application version. The dashboard
            metrics endpoint is authenticated and refreshes every five seconds.

            This release provides GitHub's source code archives only; it does not attach a wheel
            or checksum bundle.

            Install on an Ubuntu server with Sanaei 3x-ui already installed:

            ```bash
            bash <(curl -sL https://raw.githubusercontent.com/DonMonro/psiphon-3x-ui/${{ github.ref_name }}/install.sh) \
              || bash <(wget -qO- https://raw.githubusercontent.com/DonMonro/psiphon-3x-ui/${{ github.ref_name }}/install.sh)
            ```

          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
